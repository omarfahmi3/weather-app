<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather-App</title>
    <link rel="stylesheet" href="weather.css" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" class="wanted-city" placeholder="enter the city" spellcheck="false" />

        <div class="icon-c"><img src="images/OIP.webp" alt="" /></div>
      </div>
      <div class="error"><p>please enter a valid city</p></div>
      <div class="output"><div class="weather">
        <img  class="weather-icon" />
        <h1 class="temp"></h1>
        <h2 class="city"></h2>
      </div>
      <div class="detials">
        <div class="humidity">
          <img src="images/humidity.png" alt="hum." />
          <div class="humidity-disc">
            <h2 class="humidity-perc"></h2>
            <h3>humidity</h3>
          </div>
        </div>
        <div class="wind">
          <img src="images/wind.png" alt="wind" />
          <div class="wind-disc">
            <h2 class="wind-s"></h2>
            <h3>wind speed</h3>
          </div>
        </div>
      </div></div>
    </div>
    <script src="weatherScript.js"></script>
  </body>
</html>
